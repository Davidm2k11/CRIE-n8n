name: fetch-jd

# Utility, not CI: fetches a public LinkedIn job posting from a GitHub-hosted
# runner (unrestricted egress) and commits the result under jd/<id>/ on the
# branch it ran on. The Claude Code remote sandbox cannot reach linkedin.com.
# ci.yml is untouched; the result commit carries [skip ci].
#
# To fetch a posting: put its numeric id on the first line of jd/REQUEST and
# push; or run the workflow manually with the job_id input.
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Numeric LinkedIn job id (from /jobs/view/<id>/)"
        required: true
  push:
    branches: [claude/linkedin-jd-extraction-da822a]
    paths: [jd/REQUEST]

permissions:
  contents: write

jobs:
  fetch:
    name: Fetch posting
    runs-on: ubuntu-latest
    env:
      JOB_ID_INPUT: ${{ github.event.inputs.job_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve job id (workflow input, else jd/REQUEST)
        run: |
          id="${JOB_ID_INPUT:-$(head -n1 jd/REQUEST 2>/dev/null | tr -dc '0-9')}"
          if [ -z "$id" ]; then
            echo "No job id: pass the job_id input or put the numeric id in jd/REQUEST" >&2
            exit 1
          fi
          echo "JOB_ID=$id" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and parse posting
        run: python3 .github/scripts/fetch_jd.py "$JOB_ID"

      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jd-${{ env.JOB_ID }}
          path: jd/${{ env.JOB_ID }}
          if-no-files-found: warn

      - name: Commit result to branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jd
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "chore(jd): fetched LinkedIn posting $JOB_ID [skip ci]"
          git push
